name: ci-pipeline
on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "main"
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  ci_native_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v6.0.1
        with:
          go-version: '1.24'
          
      - name: Run unit test
        run: make test

      - name: log in to Docker hub
        if: ${{github.event_name != 'pull_request'}}
        uses: docker/login-action@74b08dae5e0eca7ea9643e0a9facc64a75459cca # v3.3.0
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - uses: docker/metadata-action@902fa3c054ad9413b7d22471cd1e3b0da87bd99c # v5.6.1
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/test123
          tags: |
            type=ref,event=tag
            type=raw,value=dev,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}