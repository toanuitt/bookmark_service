basePath: /
definitions:
  handler.ShortenURLRequest:
    properties:
      exp:
        example: 3600
        maximum: 3600
        type: integer
      url:
        example: https://example.com
        type: string
    required:
    - exp
    - url
    type: object
  handler.ShortenURLResponse:
    properties:
      code:
        example: abc123
        type: string
      message:
        example: Shorten URL generated successfully!
        type: string
    type: object
  handler.healthCheckResponse:
    properties:
      error:
        type: string
      instance_id:
        example: instance-test
        type: string
      message:
        example: OK
        type: string
      service_name:
        example: bookmark_service
        type: string
    type: object
  handler.registerInputBody:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  response.Response:
    properties:
      details: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API documentation for bookmark service
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: BookMark_Service API
  version: "1.2"
paths:
  /gen-pass:
    get:
      description: Generates a cryptographically secure random password
      produces:
      - text/plain
      responses:
        "200":
          description: Generated password
          schema:
            type: string
        "500":
          description: Error message
          schema:
            type: string
      summary: Generate a random password
      tags:
      - password
  /health-check:
    get:
      description: Health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.healthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Health check
      tags:
      - health_check
  /v1/links/redirect/{code}:
    get:
      consumes:
      - application/json
      description: Get URL by code
      parameters:
      - description: Url code
        format: string
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request - invalid URL or validation error
        "404":
          description: URL not found
        "500":
          description: Internal Server Error
      summary: Get URL
      tags:
      - URL Shortener
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Shortens a given URL and returns a shortened URL code.
      parameters:
      - description: URL to shorten
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ShortenURLResponse'
        "400":
          description: Bad Request - invalid URL or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shorten URL
      tags:
      - URL Shortener
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account using username, password, display name,
        and email.
      parameters:
      - description: User registration payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.registerInputBody'
      produces:
      - application/json
      responses:
        "200":
          description: Register success
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Invalid request or missing required fields
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - Users
swagger: "2.0"
